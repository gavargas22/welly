name: Build Universal Wheels

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]
  workflow_dispatch:

jobs:
  build-wheel:
    name: Build universal wheel
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Required for proper version detection from git tags

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Set up Python
      run: uv python install 3.13

    - name: Build wheel and sdist
      run: uv build

    - name: List built artifacts
      run: ls -lh dist/

    - name: Upload wheel artifacts
      uses: actions/upload-artifact@v4
      with:
        name: wheels
        path: dist/*.whl
        retention-days: 7

    - name: Upload sdist artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sdist
        path: dist/*.tar.gz
        retention-days: 7

  test-wheel:
    name: Test wheel on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    needs: build-wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Download wheel artifacts
      uses: actions/download-artifact@v4
      with:
        name: wheels
        path: dist/

    - name: Install wheel
      run: uv pip install --system dist/*.whl

    - name: Test import
      run: uv run python -c "import welly; print(f'welly version: {welly.__version__}')"

    - name: Install test dependencies
      run: uv pip install --system pytest pytest-cov pytest-mpl

    - name: Run basic tests
      run: uv run pytest tests/ -v --ignore=tests/test_plots.py
      continue-on-error: true  # Some tests may require test data files

  verify-universal:
    name: Verify wheel is universal
    needs: build-wheel
    runs-on: ubuntu-latest

    steps:
    - name: Download wheel artifacts
      uses: actions/download-artifact@v4
      with:
        name: wheels
        path: dist/

    - name: Install wheel tools
      run: pip install wheel-inspect

    - name: Inspect wheel
      run: |
        wheel-inspect dist/*.whl
        # Verify the wheel is tagged as py3-none-any (universal)
        filename=$(ls dist/*.whl)
        if [[ $filename == *"py3-none-any"* ]]; then
          echo "✓ Wheel is universal (py3-none-any)"
        else
          echo "✗ Warning: Wheel is not universal"
          echo "Filename: $filename"
          exit 1
        fi

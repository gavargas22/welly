name: Build Universal Wheels

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]
  workflow_dispatch:

jobs:
  build-wheel:
    name: Build universal wheel
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Required for proper version detection from git tags

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Set up Python
      run: uv python install 3.13

    - name: Build wheel and sdist
      run: uv build

    - name: List built artifacts
      run: ls -lh dist/

    - name: Upload wheel artifacts
      uses: actions/upload-artifact@v4
      with:
        name: wheels
        path: dist/*.whl
        retention-days: 7

    - name: Upload sdist artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sdist
        path: dist/*.tar.gz
        retention-days: 7

  verify-universal:
    name: Verify wheel is universal
    needs: build-wheel
    runs-on: ubuntu-latest

    steps:
    - name: Download wheel artifacts
      uses: actions/download-artifact@v4
      with:
        name: wheels
        path: dist/

    - name: Install wheel tools
      run: pip install wheel-inspect

    - name: Inspect wheel
      run: |
        wheel-inspect dist/*.whl
        # Verify the wheel is tagged as py3-none-any (universal)
        filename=$(ls dist/*.whl)
        if [[ $filename == *"py3-none-any"* ]]; then
          echo "✓ Wheel is universal (py3-none-any)"
        else
          echo "✗ Warning: Wheel is not universal"
          echo "Filename: $filename"
          exit 1
        fi

  smoke-test:
    name: Smoke test wheel installation
    needs: build-wheel
    runs-on: ubuntu-latest

    steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Set up Python
      run: uv python install 3.13

    - name: Download wheel artifacts
      uses: actions/download-artifact@v4
      with:
        name: wheels
        path: dist/

    - name: Install wheel
      run: uv pip install --system dist/*.whl

    - name: Test import and version
      run: python -c "import welly; print(f'Successfully imported welly version: {welly.__version__}')"

name: Build Universal Wheels

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]
  workflow_dispatch:

jobs:
  build-wheel:
    name: Build universal wheel
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Required for proper version detection from git tags

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Set up Python
      run: uv python install 3.13

    - name: Build wheel and sdist
      run: uv build

    - name: List built artifacts
      run: ls -lh dist/

    - name: Upload wheel artifacts
      uses: actions/upload-artifact@v4
      with:
        name: wheels
        path: dist/*.whl
        retention-days: 7

    - name: Upload sdist artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sdist
        path: dist/*.tar.gz
        retention-days: 7

  verify-universal:
    name: Verify wheel is universal
    needs: build-wheel
    runs-on: ubuntu-latest

    steps:
    - name: Download wheel artifacts
      uses: actions/download-artifact@v4
      with:
        name: wheels
        path: dist/

    - name: Verify wheel is universal
      run: |
        # List wheel contents
        echo "Wheel file:"
        ls -lh dist/*.whl

        # Verify the wheel is tagged as py3-none-any (universal)
        filename=$(ls dist/*.whl)
        echo "Filename: $filename"

        if [[ $filename == *"py3-none-any"* ]]; then
          echo "✓ Wheel is universal (py3-none-any)"
        else
          echo "✗ Error: Wheel is not universal"
          echo "Expected 'py3-none-any' in filename but got: $filename"
          exit 1
        fi

        # Inspect wheel metadata using unzip
        echo ""
        echo "Wheel metadata:"
        unzip -p dist/*.whl "*.dist-info/WHEEL" || echo "Could not extract WHEEL metadata"

  smoke-test:
    name: Smoke test wheel installation
    needs: build-wheel
    runs-on: ubuntu-latest

    steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Set up Python
      run: uv python install 3.13

    - name: Download wheel artifacts
      uses: actions/download-artifact@v4
      with:
        name: wheels
        path: dist/

    - name: Install wheel and test
      run: |
        # Install the wheel using uv (creates a virtual environment automatically)
        uv pip install dist/*.whl

        # Test import and version
        uv run python -c "import welly; print(f'Successfully imported welly version: {welly.__version__}')"

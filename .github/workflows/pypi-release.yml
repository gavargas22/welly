# This workflow builds packages and publishes them when code is pushed to main
# It uploads artifacts to the GitHub release and optionally to PyPI

name: Build and Publish Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build distribution packages
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Required for proper version detection from git tags

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Set up Python
      run: uv python install 3.13

    - name: Build wheel and sdist
      run: uv build

    - name: List built artifacts
      run: ls -lh dist/

    - name: Upload build artifacts for other jobs
      uses: actions/upload-artifact@v4
      with:
        name: dist-packages
        path: dist/
        retention-days: 7

  upload-to-release:
    name: Upload artifacts to GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create/update releases

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist-packages
        path: dist/

    - name: Get package version
      id: version
      run: |
        # Extract version from wheel filename
        WHEEL_FILE=$(ls dist/*.whl)
        VERSION=$(echo $WHEEL_FILE | sed -n 's/.*welly-\([0-9.]*\).*/\1/p')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Package version: $VERSION"

    - name: Create/Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: Release v${{ steps.version.outputs.version }}
        body: |
          Automated release from commit ${{ github.sha }}

          ## Artifacts
          - Python wheel (universal)
          - Source distribution (sdist)

          ## Installation
          ```bash
          pip install welly==${{ steps.version.outputs.version }}
          ```
        files: dist/*
        fail_on_unmatched_files: true
        draft: false
        prerelease: false

  publish-to-pypi:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    # Add 'continue-on-error: true' to allow the workflow to succeed even if PyPI upload fails
    # Remove this line once PyPI trusted publishing is configured
    continue-on-error: true
    permissions:
      id-token: write      # Required for trusted publishing
      attestations: write  # Required for package attestations
      contents: read

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist-packages
        path: dist/

    - name: Publish to PyPI using trusted publishing
      uses: pypa/gh-action-pypi-publish@release/v1
      # To enable PyPI uploads:
      # 1. Go to https://pypi.org/manage/account/publishing/
      # 2. Add this GitHub repository as a trusted publisher
      # 3. Remove the 'continue-on-error: true' line above
    
